services:
  ctfd:
    build:
      context: .
      network: host
    restart: always
    ports:
      - "8080:8000"
    environment:
      - UPLOAD_FOLDER=/var/uploads
      - DATABASE_URL=postgresql+psycopg2://ctfd:ctfd@db:5432/ctfd
      - REDIS_URL=redis://cache:6379
      - WORKERS=1
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
      - REVERSE_PROXY=true
      - SECRET_KEY=266921f3cc4d51c0560792a5077f09a6f2a334eba18d1268c4c691c839d7609a
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
      - .:/opt/CTFd:ro
    depends_on:
      permissions:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      cache:
        condition: service_started
    networks:
        default:
        internal:

  # TODO: CTFd 4.0 Migrate to named volumes. Users will likely need to manually migrate existing files
  permissions:
    image: alpine:3.23
    user: root
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
    command: chown -R 1001:1001 /var/uploads /var/log/CTFd

  nginx:
    image: nginx:stable
    restart: always
    volumes:
      - ./conf/nginx/http.conf:/etc/nginx/nginx.conf
    ports:
      - 80:80
    depends_on:
      - ctfd

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_DB=ctfd
      - POSTGRES_USER=ctfd
      - POSTGRES_PASSWORD=ctfd
    volumes:
      - .data/postgres:/var/lib/postgresql/data
    networks:
        internal:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctfd -d ctfd"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:4
    restart: always
    volumes:
    - .data/redis:/data
    networks:
        internal:

networks:
    default:
    internal:
        internal: true
