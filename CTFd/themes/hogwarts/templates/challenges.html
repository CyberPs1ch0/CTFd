{% extends "base.html" %}

{% block content %}
  <div class="container pt-4 pb-2">
    <div class="text-center mb-4">
      <h1 class="hero-title" style="font-size: 2.8rem;">Challenges</h1>
      <p class="hero-submotto">Solve challenges, decipher formulas, and claim victory for your team</p>
      <div class="magical-divider">
        <span>✦ ✦ ✦</span>
      </div>
    </div>

    <div class="row">
      <div class="col-md-12">
        {% include "components/errors.html" %}
      </div>
    </div>

    <div 
      x-data="ChallengeBoard" 
      @load-challenges.window="loadChallenges()" 
      @load-challenge.window="loadChallenge($event.detail)"
    >
      <div
          x-ref="challengeWindow" id="challenge-window" class="modal fade" tabindex="-1" role="dialog" x-data=""
          x-html="$store.challenge.data.view"
      ></div>

      <div x-show="!loaded">
        <div class="min-vh-50 d-flex align-items-center">
          <div class="text-center w-100 py-5">
            <i class="fas fa-wand-magic-sparkles fa-spin fa-3x fa-fw" style="color: var(--hw-gold-bright);"></i>
            <p class="mt-3 text-gold" style="font-family: var(--hw-font-heading); letter-spacing: 2px;">
              Loading Challenges...
            </p>
          </div>
        </div>
      </div>

      <div x-show="loaded">
        <template x-for="(category, idx) in getCategories()" :key="idx">
          <div class="pt-4 mb-4">
            <div class="category-header d-flex justify-content-between align-items-baseline">
              <h3 class="d-flex align-items-center">
                <span class="category-icon me-2">
                  <i class="fas" :class="getCategoryIconClass(category)"></i>
                </span>
                <span x-text="category"></span>
              </h3>
              <span class="text-muted small" style="font-family: var(--hw-font-heading); letter-spacing: 1px;" x-text="getChallenges(category).length + (getChallenges(category).length === 1 ? ' Challenge' : ' Challenges')"></span>
            </div>

            <div class="category-challenges d-flex flex-column">
              <div class="challenges-row row">
                <template x-for="(c, idx) in getChallenges(category)" :key="c.id">
                  <div class="col-sm-6 col-md-4 col-lg-3 my-3">
                    <button
                        class="challenge-button btn w-100 h-100 text-start"
                        :class="[
                          c.solved_by_me ? 'challenge-solved' : '',
                          ...c.tags.map((tag) => `tag-${tag.value.replace(/ /g, '-')}`),
                        ];"
                        :value="c.id" @click="loadChallenge(c.id)"
                    >
                      <div class="challenge-inner my-2">
                        <p x-text="c.name"></p>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                          <span x-text="c.value + ' PTS'"></span>
                          <i class="fas fa-quill" style="color: var(--hw-gold-muted); opacity: 0.6;"></i>
                        </div>
                      </div>
                    </button>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  <script>
    function getCategoryIconClass(category) {
      const c = (category || '').toLowerCase();
      if (c.includes('outdoor')) return 'fa-compass';
      if (c.includes('sanity')) return 'fa-circle-check';
      if (c.includes('elementary')) return 'fa-bolt';
      if (c.includes('runic') || c.includes('sigil') || c.includes('incantation')) return 'fa-scroll';
      if (c.includes('divination')) return 'fa-eye';
      if (c.includes('magical') || c.includes('objects')) return 'fa-flask';
      if (c.includes('dimension') || c.includes('teleport')) return 'fa-infinity';
      if (c.includes('fantastic') || c.includes('beast')) return 'fa-dragon';
      if (c.includes('vows') || c.includes('contract')) return 'fa-file-signature';
      if (c.includes('imagination') || c.includes('freeform')) return 'fa-wand-magic-sparkles';
      return 'fa-shapes';
    }
  </script>
  {{ Assets.js("assets/js/challenges.js") }}
  <script src="/themes/hogwarts/static/vendor/katex/katex.min.js"></script>
  <script src="/themes/hogwarts/static/vendor/katex/auto-render.min.js"></script>
  <script src="/themes/hogwarts/static/js/hogwarts.js"></script>
{% endblock %}
