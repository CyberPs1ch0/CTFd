<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b162c" />
      <stop offset="70%" stop-color="#060c18" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    
    <!-- Gold Trim Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe894" />
      <stop offset="30%" stop-color="#e5c158" />
      <stop offset="70%" stop-color="#b88f28" />
      <stop offset="100%" stop-color="#8a6712" />
    </linearGradient>

    <!-- Cyan/Blue Ribbon Gradient -->
    <linearGradient id="cyanRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="30%" stop-color="#11998e" />
      <stop offset="70%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#3a7bd5" />
    </linearGradient>

    <!-- Glowing Blue Ribbon -->
    <linearGradient id="mobiusGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glow & Shield Base -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="5" filter="url(#goldGlow)" />
  <circle cx="200" cy="200" r="180" fill="none" stroke="rgba(229, 193, 88, 0.4)" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- Background Math Symbols -->
  <g fill="rgba(229, 193, 88, 0.12)" font-family="serif" font-size="22" font-style="italic">
    <text x="70" y="110">∑</text>
    <text x="310" y="110">∫</text>
    <text x="55" y="270">π</text>
    <text x="325" y="270">∞</text>
    <text x="200" y="80" text-anchor="middle" font-size="18">∇²ψ = 0</text>
  </g>

  <!-- Infinity / Möbius Ribbon in Cyan Gradient -->
  <g filter="url(#cyanGlow)">
    <path d="M 140 185 C 100 135, 70 185, 110 225 C 150 265, 200 185, 250 145 C 290 105, 330 155, 290 195 C 250 235, 200 155, 150 195" 
          fill="none" stroke="url(#mobiusGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <path d="M 140 185 C 100 135, 70 185, 110 225 C 150 265, 200 185, 250 145 C 290 105, 330 155, 290 195 C 250 235, 200 155, 150 195" 
        fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6" stroke-linecap="round" />

  <!-- Center Monogram MSC -->
  <text x="200" y="215" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-weight="900" font-size="78" fill="url(#goldGrad)" filter="url(#goldGlow)" letter-spacing="4">
    MSC
  </text>
  <text x="200" y="215" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-weight="900" font-size="78" fill="#ffffff" opacity="0.4" letter-spacing="4">
    MSC
  </text>

  <!-- Banner Ribbons and Labels -->
  <!-- Top Arc: INPT -->
  <path id="topArc" d="M 100 110 A 130 130 0 0 1 300 110" fill="none" />
  <text font-family="'Cinzel', serif" font-size="17" font-weight="700" fill="url(#goldGrad)" letter-spacing="6">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      ★ INPT ★
    </textPath>
  </text>

  <!-- Bottom Banner Pill -->
  <rect x="65" y="285" width="270" height="38" rx="19" fill="#0b172a" stroke="url(#goldGrad)" stroke-width="2" />
  <text x="200" y="309" text-anchor="middle" font-family="'Cinzel', serif" font-size="14.5" font-weight="800" fill="#ffe484" letter-spacing="2">
    MATH &amp; SCIENCE CLUB
  </text>

  <!-- Bottom Flourish Motto -->
  <text x="200" y="352" text-anchor="middle" font-family="'Crimson Pro', serif" font-size="13.5" font-style="italic" fill="rgba(245, 237, 216, 0.75)" letter-spacing="1">
    MSC DARES THE BEST
  </text>
</svg>
